name: Qualify and deploy PARLOR kernel workbench
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/cargo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust and bindings
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy,rust-docs --target wasm32-unknown-unknown
          rustup default 1.95.0
          curl -fsSL https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.127/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz -o /tmp/parlor-bindgen.tar.gz
          echo '61d4a7dc85acfa0d2354ccc0b8361928c7e52a746d17f28ebaa795ed3dc1614a  /tmp/parlor-bindgen.tar.gz' | sha256sum --check
          tar -xzf /tmp/parlor-bindgen.tar.gz -C /tmp
      - name: Guard native kernels and qualify Rust
        run: |
          python browser/workbench/verify-foundation.py
          cargo fmt --all -- --check
          cargo test --release --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo run --release --locked -p parlor-cli -- verify
          python tools/ferris-contract/check.py
          cargo fmt --manifest-path browser/workbench/Cargo.toml -- --check
          cargo test --release --locked --manifest-path browser/workbench/Cargo.toml
          cargo clippy --release --locked --manifest-path browser/workbench/Cargo.toml --all-targets -- -D warnings
          cargo clippy --release --locked --manifest-path browser/workbench/Cargo.toml --target wasm32-unknown-unknown --lib -- -D warnings
      - name: Build prototype and independent CLI controls
        run: |
          python browser/workbench/build-prototype.py --bindgen /tmp/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl/wasm-bindgen
          python browser/workbench/package-site.py
          python browser/workbench/verify-site.py target/kernel-release/PARLOR --commit "$(git rev-parse HEAD)"
      - name: Exercise actual worker under project prefix
        working-directory: browser/workbench
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:pages
      - name: Independently rebuild corresponding software outside Git
        run: python browser/workbench/verify-source.py --site target/kernel-release/PARLOR --bindgen /tmp/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl/wasm-bindgen
      - name: Retain qualified complete artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: parlor-workbench-qualification
          include-hidden-files: true
          path: |
            browser/workbench/.cache/
            target/kernel-release/
      - name: Retain failed QA without partial binary release
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parlor-workbench-failed-qa
          include-hidden-files: true
          path: |
            browser/workbench/.cache/
            context/waves/2026-11-01-wasm-player/
            LICENSE
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: parlor-workbench-qualification
          path: .
      - name: Verify transferred source and artifact
        run: python browser/workbench/verify-site.py target/kernel-release/PARLOR --commit "${{ github.sha }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/kernel-release/PARLOR
      - name: Deploy only tested public files
        id: deployment
        uses: actions/deploy-pages@v4
