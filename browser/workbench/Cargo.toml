[package]
name = "parlor-browser-workbench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
parlor-core = { path = "../../crates/parlor-core" }
parlor-chess = { path = "../../crates/parlor-chess" }
parlor-checkers = { path = "../../crates/parlor-checkers" }
parlor-backgammon = { path = "../../crates/parlor-backgammon" }
parlor-go = { path = "../../crates/parlor-go" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
wasm-bindgen = "=0.2.127"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
